; Astucia Wiki — PHP-FPM pool overrides.
[www]
; TCP rather than a unix socket so nginx and FPM stay independent of file
; ownership inside the container.
listen = 127.0.0.1:9000

; The env-driven config.php reads getenv(), which FPM does not pass through by
; default: clear_env=no is what makes docker -e reach the application.
clear_env = no

; Errors to the container log, so `docker logs` shows PHP problems.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /data/logs/php-error.log
php_admin_flag[log_errors] = on
