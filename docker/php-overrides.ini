; Astucia Wiki — PHP settings that matter for this app.

; Attachments and diagram uploads go through PHP; keep in step with
; client_max_body_size in nginx.conf.
upload_max_filesize = 64M
post_max_size       = 64M

; An AI chat reply runs the whole agentic loop inside the request. The code
; already calls set_time_limit(0) on the detached path, but a low default here
; would kill the request before it gets there.
max_execution_time  = 900
memory_limit        = 512M

; Sessions live in the container's own tmp; they are not content and are not
; expected to survive a restart.
session.gc_maxlifetime = 86400

; Errors go to the log, never to the response — a stray warning in JSON output
; breaks every API call in the UI.
display_errors       = Off
log_errors           = On
error_log            = /data/logs/php-error.log
