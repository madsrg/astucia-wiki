; Three processes in one container: nginx, PHP-FPM and cron. A wiki is an
; appliance — one image that runs is friendlier for self-hosting than three
; services to wire up. Split them if you prefer (see the guide).
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; The realtime hub. nginx reverse-proxies /.well-known/mercure to it on :3000.
; Disable with ENABLE_REALTIME=false; the wiki then falls back to polling, which is
; exactly how every release before realtime behaved.
[program:mercure]
command=/usr/local/bin/mercure run --config /etc/caddy/mercure.Caddyfile
; The entrypoint exports ENABLE_REALTIME, so 'false' means the hub is never started at
; all rather than started and ignored — it is a Go binary holding real memory. Unlike
; ENABLE_CRON, which only removes the crontab, this stops the process itself.
autostart=%(ENV_ENABLE_REALTIME)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=15

; Scheduled AI agent jobs and the daily digest. Disable with ENABLE_CRON=false
; if you run them from the host or don't use them.
[program:crond]
command=crond -f -l 8
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
