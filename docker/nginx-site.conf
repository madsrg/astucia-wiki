#
# The site itself, included by both server blocks: plain HTTP on 80 (nginx.conf) and, when
# the entrypoint finds a certificate, HTTPS with HTTP/2 on 443 (/etc/nginx/https.conf).
# One copy, so the two listeners cannot drift apart.

root        /var/www/html;
index       index.php;

# ES modules are served by nginx, not PHP: without a correct
# Content-Type the browser refuses to load them and the UI never starts.
location ~* \.mjs$ { types { } default_type application/javascript; }

# The realtime hub, same-origin so the ticket cookie flows without CORS.
#
# This block must come BEFORE the dotfile deny below: `location ~ /\.` matches
# /.well-known/mercure too, and nginx prefers a regex match over a prefix one — so
# without the `^~` modifier the hub would 404 and the failure would look like a
# broken hub rather than a routing rule.
#
# SSE needs buffering off (nginx would otherwise hold events until a buffer filled,
# turning push back into slow polling) and a read timeout longer than the stream
# lives, or nginx closes an idle connection out from under the client.
location ^~ /.well-known/mercure {
    proxy_pass          http://127.0.0.1:3000;
    proxy_http_version  1.1;
    proxy_set_header    Connection          '';
    proxy_set_header    Host                $host;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  24h;
    chunked_transfer_encoding off;
    # Never compress the event stream. gzip_types above does not list
    # text/event-stream, but that is an accident of the list, and adding it would
    # be harmful twice over: private updates compressed in one stream with data an
    # attacker can influence are open to BREACH-style attacks, and every compressed
    # stream holds its own encoder (several MiB) for as long as it stays connected —
    # the regression Mercure 1.0.4 fixed in its own default Caddyfile.
    gzip                off;
}

# Never serve the config or any dotfile, even if PHP handling breaks.
location = /config.php    { deny all; return 404; }
location = /config.php.txt { deny all; return 404; }
location ~ /\.            { deny all; return 404; }

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    include        fastcgi_params;
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

    # An AI reply runs the agentic loop inside the request, and an
    # extended-reasoning /aiJob can take many minutes. A default 60s
    # read timeout would cut those off mid-answer.
    fastcgi_read_timeout    900s;
    fastcgi_send_timeout    900s;
    fastcgi_buffering       off;
}

location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
}
