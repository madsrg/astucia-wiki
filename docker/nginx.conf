user  www-data;
worker_processes  auto;
error_log  /data/logs/nginx-error.log warn;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /data/logs/nginx-access.log;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Attachments are uploaded through PHP; keep this in step with the
    # upload_max_filesize / post_max_size in php-overrides.ini.
    client_max_body_size 64m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen      80;
        # IPv6 as well, written by the entrypoint only when the kernel has it: rootless
        # Podman forwards a published port over IPv6 too, so without this `localhost`
        # (::1 first) is accepted and then reset. A glob, because an include that names
        # one file fails when it is absent, and on an ipv6.disable=1 kernel
        # `listen [::]:80` would stop nginx from starting at all.
        include     /etc/nginx/listen-ipv6*.conf;
        server_name _;
        include     /etc/nginx/astucia-site.conf;
    }

    # HTTPS with HTTP/2 on 443 — written by the entrypoint only when a certificate is
    # present (see section 2e there), so a container without one starts exactly as before.
    # Browsers speak HTTP/2 only over TLS, and realtime needs it: over HTTP/1.1 a browser
    # allows ~6 connections per host and an SSE stream holds one. A glob, so the include
    # is silently empty when the file is absent.
    include /etc/nginx/https*.conf;
}
