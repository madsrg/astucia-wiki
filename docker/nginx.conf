user  www-data;
worker_processes  auto;
error_log  /data/logs/nginx-error.log warn;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /data/logs/nginx-access.log;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Attachments are uploaded through PHP; keep this in step with the
    # upload_max_filesize / post_max_size in php-overrides.ini.
    client_max_body_size 64m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen      80;
        server_name _;
        root        /var/www/html;
        index       index.php;

        # ES modules are served by nginx, not PHP: without a correct
        # Content-Type the browser refuses to load them and the UI never starts.
        location ~* \.mjs$ { types { } default_type application/javascript; }

        # Never serve the config or any dotfile, even if PHP handling breaks.
        location = /config.php    { deny all; return 404; }
        location = /config.php.txt { deny all; return 404; }
        location ~ /\.            { deny all; return 404; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # An AI reply runs the agentic loop inside the request, and an
            # extended-reasoning /aiJob can take many minutes. A default 60s
            # read timeout would cut those off mid-answer.
            fastcgi_read_timeout    900s;
            fastcgi_send_timeout    900s;
            fastcgi_buffering       off;
        }

        location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
